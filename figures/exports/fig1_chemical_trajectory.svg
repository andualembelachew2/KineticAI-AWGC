<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="70" y="34" font-size="17" font-weight="700" fill="#222">Network connectivity (NBO/BO) programs the time-course of therapeutic ion release</text>
  <text x="70" y="54" font-size="12" fill="#666">Schematic ion-release flux of a Ca–Si–P–O glass-ceramic in physiological fluid</text>

  <!-- Stage zones -->
  <rect x="70" y="70" width="280" height="330" fill="#efefef"/>
  <rect x="350" y="70" width="280" height="330" fill="#e8f2ed"/>
  <rect x="630" y="70" width="280" height="330" fill="#eee9f8"/>
  <line x1="350" y1="70" x2="350" y2="400" stroke="#fff" stroke-width="2"/>
  <line x1="630" y1="70" x2="630" y2="400" stroke="#fff" stroke-width="2"/>

  <!-- RTZ band -->
  <rect x="70" y="170" width="840" height="120" fill="#dfeaf7" opacity="0.9"/>
  <line x1="70" y1="170" x2="910" y2="170" stroke="#1d4e89" stroke-width="1.4" stroke-dasharray="6 3"/>
  <line x1="70" y1="290" x2="910" y2="290" stroke="#1d4e89" stroke-width="1.4" stroke-dasharray="6 3"/>
  <text x="902" y="163" font-size="11" font-style="italic" text-anchor="end" fill="#1d4e89">Regenerative target zone (RTZ): above minimum effective flux, below toxic limit</text>

  <!-- Stage headings -->
  <g text-anchor="middle" fill="#2b2b2b">
    <text x="210" y="90" font-size="13" font-weight="700">Stage I · Ion exchange</text>
    <text x="210" y="106" font-size="10.5" fill="#555">H⁺/H₃O⁺ ↔ Ca²⁺, Sr²⁺, Ag⁺, Ce³⁺</text>
    <text x="210" y="120" font-size="10.5" fill="#555">at network-modifier sites; fast, surface-controlled</text>

    <text x="490" y="90" font-size="13" font-weight="700">Stage II · Gel-layer barrier</text>
    <text x="490" y="106" font-size="10.5" fill="#555">Si–OH groups repolymerise into a silica-rich gel;</text>
    <text x="490" y="120" font-size="10.5" fill="#555">release becomes diffusion-limited</text>

    <text x="770" y="90" font-size="13" font-weight="700">Stage III · HCA + passivation</text>
    <text x="770" y="106" font-size="10.5" fill="#555">Ca–P precipitation forms hydroxycarbonate</text>
    <text x="770" y="120" font-size="10.5" fill="#555">apatite (HCA); surface passivates, flux levels off</text>
  </g>

  <!-- Curves -->
  <!-- low NBO/BO -->
  <path d="M70 352 L910 352" fill="none" stroke="#1f5aa8" stroke-width="3" stroke-linecap="round"/>
  <!-- high NBO/BO -->
  <path d="M70 255 C110 215 150 188 195 188 C260 188 300 300 400 350 C450 376 520 384 600 385 L910 386" fill="none" stroke="#6b4fa8" stroke-width="3" stroke-linecap="round"/>
  <!-- intermediate NBO/BO -->
  <path d="M70 312 C200 310 270 272 340 238 C400 208 450 198 520 196 C650 196 800 206 910 215" fill="none" stroke="#1d7a6d" stroke-width="3" stroke-linecap="round"/>

  <!-- Direct curve labels (with white halo) -->
  <g font-size="11" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke">
    <text x="205" y="182" fill="#6b4fa8">Burst, then depletion</text>
    <text x="540" y="186" fill="#1d7a6d">Sustained release inside RTZ</text>
    <text x="85" y="372" fill="#1f5aa8">Sub-therapeutic throughout</text>
  </g>

  <!-- Axes -->
  <line x1="70" y1="400" x2="70" y2="66" stroke="#444" stroke-width="1.3"/>
  <line x1="70" y1="400" x2="916" y2="400" stroke="#444" stroke-width="1.3"/>
  <polygon points="70,60 65,70 75,70" fill="#444"/>
  <polygon points="922,400 912,395 912,405" fill="#444"/>
  <text x="496" y="424" font-size="12" text-anchor="middle" fill="#2b2b2b">Time <tspan font-style="italic">t</tspan> in physiological fluid</text>
  <text x="26" y="235" font-size="12" text-anchor="middle" fill="#2b2b2b" transform="rotate(-90 26 235)">Ion-release flux</text>

  <!-- Legend -->
  <g font-size="12" fill="#2b2b2b">
    <line x1="70" y1="456" x2="102" y2="456" stroke="#6b4fa8" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="460"><tspan font-weight="700">High NBO/BO</tspan> (depolymerised network)</text>
    <line x1="400" y1="456" x2="432" y2="456" stroke="#1d7a6d" stroke-width="3" stroke-linecap="round"/>
    <text x="440" y="460"><tspan font-weight="700">Intermediate NBO/BO</tspan> (programmed network)</text>
    <line x1="720" y1="456" x2="752" y2="456" stroke="#1f5aa8" stroke-width="3" stroke-linecap="round"/>
    <text x="760" y="460"><tspan font-weight="700">Low NBO/BO</tspan> (connected network)</text>
  </g>

  <!-- Footnote / caption -->
  <line x1="70" y1="486" x2="910" y2="486" stroke="#ccc" stroke-width="1"/>
  <g font-size="11.5" fill="#333">
    <text x="70" y="508"><tspan font-weight="700">Figure.</tspan> Conceptual release profiles for three network designs. A highly depolymerized glass (high NBO/BO) dissolves quickly: it</text>
    <text x="70" y="525">releases a burst of ions, then the gel layer and apatite film choke the flux below the useful range. A highly connected glass (low</text>
    <text x="70" y="542">NBO/BO) is too durable to reach the therapeutic threshold. An intermediate NBO/BO, tuned by co-doping (Ce³⁺, Sr²⁺, Ag⁺), keeps</text>
    <text x="70" y="559">the flux inside the RTZ across all three stages, which is the design goal.</text>
    <text x="70" y="582" font-size="10.5" fill="#555"><tspan font-weight="700">Abbreviations:</tspan> NBO/BO, ratio of non-bridging to bridging oxygens (lower = more connected network); RTZ, regenerative target zone;</text>
    <text x="70" y="597" font-size="10.5" fill="#555">HCA, hydroxycarbonate apatite. Curves are schematic and illustrate trends only; they are not measured data. Axes are in arbitrary units.</text>
  </g>
</svg>
