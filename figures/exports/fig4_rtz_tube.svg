\documentclass[tikz,border=5mm]{standalone}
\usepackage{pgfplots}
\pgfplotsset{compat=1.18}

% Okabe-Ito palette (colour-blind safe)
\definecolor{cbGreen}{HTML}{009E73}
\definecolor{cbVermilion}{HTML}{D55E00}
\definecolor{cbBlue}{HTML}{0072B2}
\definecolor{ink}{HTML}{1F2933}

% Single source of truth for the admissible window
\pgfmathsetmacro{\lo}{0.3}
\pgfmathsetmacro{\hi}{0.7}

\begin{document}
\begin{tikzpicture}
\begin{axis}[
    width=14cm, height=8.4cm,
    xlabel={Time (days)},
    ylabel={Normalised concentration, $c/c_{\mathrm{ref}}$},
    xmin=0, xmax=14, ymin=0, ymax=1.16,
    xtick={0,2,7,14},
    ytick={0,0.3,0.7,1},
    axis lines=left, tick align=outside,
    label style={font=\small}, tick label style={font=\small},
    legend columns=2,
    legend cell align={left},
    legend style={at={(0.5,-0.19)}, anchor=north, draw=none, font=\footnotesize,
                  /tikz/every even column/.append style={column sep=0.6cm}},
]

% 1. Admissible window
\fill[gray!18] (axis cs:0,\lo) rectangle (axis cs:14,\hi);
\addlegendimage{area legend, fill=gray!18, draw=none}
\addlegendentry{Admissible window (0.3--0.7)}

% 2. Phase dividers and labels
\draw[gray!70, semithick, dashed] (axis cs:2,0) -- (axis cs:2,1.16);
\draw[gray!70, semithick, dashed] (axis cs:7,0) -- (axis cs:7,1.16);
\node[align=center, font=\footnotesize, text=ink] at (axis cs:1,1.08)    {\textbf{Phase I}\\[-1pt]\scriptsize 0--2\,d};
\node[align=center, font=\footnotesize, text=ink] at (axis cs:4.5,1.08)  {\textbf{Phase II}\\[-1pt]\scriptsize 2--7\,d};
\node[align=center, font=\footnotesize, text=ink] at (axis cs:10.5,1.08) {\textbf{Phase III}\\[-1pt]\scriptsize 7--14\,d};

% 3. Trajectories
% Target trajectory
\addplot[cbGreen, line width=1.8pt, domain=0:14, samples=120]
    {0.42 + 0.16*exp(-((x-3)^2)/6)};
\addlegendentry{Target trajectory (stays in window)}

% Burst trajectory (Overshoot)
\addplot[cbVermilion, dashed, line width=1.5pt, domain=0:14, samples=200]
    {0.15 + (0.72/(1+exp(-(x-2.2)/0.22))) * (0.62 + 0.38*exp(-(x-2.2)/2.0))};
\addlegendentry{Burst (overshoot)}

% Depleting trajectory (Undershoot)
\addplot[cbBlue, dashdotted, line width=1.5pt, domain=0:14, samples=120]
    {0.12 + 0.33*exp(-x/11.5)};
\addlegendentry{Depleting (undershoot)}

% 4. Annotations
\node[anchor=west, font=\footnotesize\bfseries, text=cbVermilion!85!black] (ov) at (axis cs:4.3,0.93) {Overshoot};
\draw[->, cbVermilion!85!black, semithick] (ov.west) -- (axis cs:3.1,0.775);

\node[anchor=north, font=\footnotesize\bfseries, text=cbBlue!85!black] (un) at (axis cs:10.8,0.15) {Undershoot};
\draw[->, cbBlue!85!black, semithick] (un.north west) -- (axis cs:10,0.264);

\end{axis}
\end{tikzpicture}
\end{document}
