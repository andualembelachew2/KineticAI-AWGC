<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Ion Concentration Kinetics Model</title>
  <desc id="desc">Kinetic regimes showing Target, Burst (Overshoot), and Depleting (Undershoot) trajectories relative to an admissible therapeutic window across Phases I, II, and III.</desc>

  <!-- Solid white canvas background for GitHub Dark Mode compatibility -->
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>

  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #1F2933; }
    .axis { stroke: #1F2933; stroke-width: 1.2; }
    .boundary { stroke: #616E7C; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .tick { font-size: 12px; text-anchor: middle; fill: #1F2933; }
    .tick-y { font-size: 12px; text-anchor: end; fill: #1F2933; }
    .axis-label { font-size: 14px; text-anchor: middle; font-weight: 500; fill: #1F2933; }
    .phase-title { font-size: 13px; font-weight: bold; text-anchor: middle; fill: #1F2933; }
    .phase-sub { font-size: 11px; text-anchor: middle; fill: #52606D; }
    .legend-text { font-size: 11px; fill: #1F2933; }
    .annotation { font-size: 12px; font-weight: bold; }
  </style>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D55E00" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0072B2" />
    </marker>
  </defs>

  <!-- 1. Admissible Therapeutic Window (c = 0.3 to 0.7) -->
  <rect x="80" y="181.67" width="620" height="113.33" fill="#E4E7EB"/>
  <text x="690" y="243" font-size="11" font-weight="bold" fill="#7B8794" text-anchor="end">Admissible Window</text>

  <!-- 2. Phase Vertical Boundaries -->
  <line class="boundary" x1="168.57" y1="50" x2="168.57" y2="380"/>
  <line class="boundary" x1="390" y1="50" x2="390" y2="380"/>

  <!-- Phase Header Labels -->
  <g id="phase-labels">
    <!-- Phase I -->
    <text class="phase-title" x="124.28" y="66">Phase I</text>
    <text class="phase-sub" x="124.28" y="80">0–2 d</text>

    <!-- Phase II -->
    <text class="phase-title" x="279.28" y="66">Phase II</text>
    <text class="phase-sub" x="279.28" y="80">2–7 d</text>

    <!-- Phase III -->
    <text class="phase-title" x="545" y="66">Phase III</text>
    <text class="phase-sub" x="545" y="80">7–14 d</text>
  </g>

  <!-- 3. Axes -->
  <line class="axis" x1="80" y1="380" x2="700" y2="380"/>
  <line class="axis" x1="80" y1="50" x2="80" y2="380"/>

  <!-- X-Axis Ticks -->
  <g id="x-ticks">
    <line class="axis" x1="80" y1="380" x2="80" y2="386"/>
    <text class="tick" x="80" y="402">0</text>

    <line class="axis" x1="168.57" y1="380" x2="168.57" y2="386"/>
    <text class="tick" x="168.57" y="402">2</text>

    <line class="axis" x1="390" y1="380" x2="390" y2="386"/>
    <text class="tick" x="390" y="402">7</text>

    <line class="axis" x1="700" y1="380" x2="700" y2="386"/>
    <text class="tick" x="700" y="402">14</text>
  </g>

  <!-- Y-Axis Ticks -->
  <g id="y-ticks">
    <line class="axis" x1="74" y1="380" x2="80" y2="380"/>
    <text class="tick-y" x="68" y="384">0</text>

    <line class="axis" x1="74" y1="295" x2="80" y2="295"/>
    <text class="tick-y" x="68" y="299">0.3</text>

    <line class="axis" x1="74" y1="181.67" x2="80" y2="181.67"/>
    <text class="tick-y" x="68" y="185">0.7</text>

    <line class="axis" x1="74" y1="96.67" x2="80" y2="96.67"/>
    <text class="tick-y" x="68" y="100">1.0</text>
  </g>

  <!-- Axis Titles -->
  <text class="axis-label" x="390" y="432">Time (days)</text>
  <text class="axis-label" x="25" y="215" transform="rotate(-90 25 215)">Normalised concentration, c/c<tspan font-size="10" dy="3">ref</tspan></text>

  <!-- 4. Trajectories -->
  <!-- Target Trajectory (cbGreen #009E73) -->
  <path fill="none" stroke="#009E73" stroke-width="3" 
        d="M 80 261 C 120 261, 150 215, 213 215 C 280 215, 340 261, 700 261"/>

  <!-- Overshoot Trajectory (cbVermilion #D55E00 - Dashed) -->
  <path fill="none" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="7 4"
        d="M 80 338 C 150 338, 175 110, 220 140 C 260 165, 320 238, 700 280"/>

  <!-- Undershoot Trajectory (cbBlue #0072B2 - Dash-dotted) -->
  <path fill="none" stroke="#0072B2" stroke-width="2.5" stroke-dasharray="8 3 2 3"
        d="M 80 348 C 130 350, 160 355, 210 360 C 280 365, 450 368, 700 368"/>

  <!-- 5. Targeted Point Annotations -->
  <text class="annotation" x="245" y="115" fill="#D55E00">Overshoot</text>
  <path fill="none" stroke="#D55E00" stroke-width="1.2" marker-end="url(#arrow-red)" d="M 240 115 L 205 130"/>

  <text class="annotation" x="520" y="335" fill="#0072B2" text-anchor="middle">Undershoot</text>
  <path fill="none" stroke="#0072B2" stroke-width="1.2" marker-end="url(#arrow-blue)" d="M 480 335 L 440 362"/>

  <!-- 6. Legend Area -->
  <g id="legend" transform="translate(100, 458)">
    <rect x="0" y="0" width="18" height="12" fill="#E4E7EB"/>
    <text class="legend-text" x="24" y="10">Admissible window (0.3–0.7)</text>

    <line x1="0" y1="26" x2="18" y2="26" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text class="legend-text" x="24" y="30">Burst (overshoot)</text>

    <line x1="280" y1="6" x2="298" y2="6" stroke="#009E73" stroke-width="3"/>
    <text class="legend-text" x="304" y="10">Target trajectory (stays in window)</text>

    <line x1="280" y1="26" x2="298" y2="26" stroke="#0072B2" stroke-width="2.5" stroke-dasharray="6 2 2 2"/>
    <text class="legend-text" x="304" y="30">Depleting (undershoot)</text>
  </g>
</svg>
