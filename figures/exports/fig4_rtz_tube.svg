<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="100%" height="100%">
  <!-- Deep white background -->
  <rect x="0" y="0" width="720" height="480" fill="#FFFFFF"/>

  <style>
    .axis { stroke: #1F2933; stroke-width: 1.5; }
    .grid { stroke: #B3B0B8; stroke-dasharray: 4,4; stroke-width: 1; }
    .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: #1F2933; }
    .label { font-size: 15px; text-anchor: middle; }
    .tick-label { font-size: 13px; }
    .phase-title { font-size: 14px; font-weight: bold; text-anchor: middle; }
    .phase-sub { font-size: 11.5px; fill: #486581; text-anchor: middle; }
    .legend-text { font-size: 12.5px; }
  </style>

  <!-- Plot Area Background & Shaded Admissible Window -->
  <!-- Plot Box: X from 70 to 670 (width 600), Y from 40 to 360 (height 320) -->
  <rect x="70" y="132.8" width="600" height="110.3" fill="#E4E7EB" opacity="0.8"/>

  <!-- Phase Dividers (x=2 -> X=155.7, x=7 -> X=370) -->
  <line class="grid" x1="155.7" y1="40" x2="155.7" y2="360"/>
  <line class="grid" x1="370" y1="40" x2="370" y2="360"/>

  <!-- Phase Labels in Reserved Top Band -->
  <g id="phase-labels">
    <text class="text phase-title" x="112.8" y="55">Phase I</text>
    <text class="text phase-sub" x="112.8" y="68">0–2 d</text>

    <text class="text phase-title" x="262.8" y="55">Phase II</text>
    <text class="text phase-sub" x="262.8" y="68">2–7 d</text>

    <text class="text phase-title" x="520" y="55">Phase III</text>
    <text class="text phase-sub" x="520" y="68">7–14 d</text>
  </g>

  <!-- Trajectories -->
  <!-- 1. Target Trajectory (Green) -->
  <path d="M 70,244 C 112.8,244 140,200 198.5,200 C 257,200 280,244 670,244" 
        fill="none" stroke="#009E73" stroke-width="2.5"/>

  <!-- 2. Overshoot / Burst Trajectory (Vermilion / Dashed) -->
  <path d="M 70,318 C 120,318 140,318 155.7,300 C 170,200 185,80 203,80 C 230,80 270,220 370,230 C 470,240 570,280 670,285" 
        fill="none" stroke="#D55E00" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 3. Undershoot / Depleting Trajectory (Blue / Dash-Dot) -->
  <path d="M 70,326 C 200,328 370,332 520,340 C 580,343 630,347 670,348" 
        fill="none" stroke="#0072B2" stroke-width="2" stroke-dasharray="8,4,2,4"/>

  <!-- Axes & Ticks -->
  <line class="axis" x1="70" y1="360" x2="670" y2="360"/> <!-- X axis -->
  <line class="axis" x1="70" y1="40" x2="70" y2="360"/>   <!-- Y axis -->

  <!-- X Ticks -->
  <g class="text tick-label" text-anchor="middle">
    <line class="axis" x1="70" y1="360" x2="70" y2="365"/>
    <text x="70" y="380">0</text>

    <line class="axis" x1="155.7" y1="360" x2="155.7" y2="365"/>
    <text x="155.7" y="380">2</text>

    <line class="axis" x1="370" y1="360" x2="370" y2="365"/>
    <text x="370" y="380">7</text>

    <line class="axis" x1="670" y1="360" x2="670" y2="365"/>
    <text x="670" y="380">14</text>
  </g>

  <!-- Y Ticks -->
  <g class="text tick-label" text-anchor="end">
    <line class="axis" x1="65" y1="360" x2="70" y2="360"/>
    <text x="60" y="364">0</text>

    <line class="axis" x1="65" y1="243.1" x2="70" y2="243.1"/>
    <text x="60" y="247">0.3</text>

    <line class="axis" x1="65" y1="132.8" x2="70" y2="132.8"/>
    <text x="60" y="137">0.7</text>

    <line class="axis" x1="65" y1="50" x2="70" y2="50"/>
    <text x="60" y="54">1.0</text>
  </g>

  <!-- Axis Titles -->
  <text class="text label" x="370" y="412">Time (days)</text>
  <text class="text label" x="20" y="200" transform="rotate(-90, 20, 200)">Normalised concentration, c/c<tspan font-size="10" dy="3">ref</tspan></text>

  <!-- Annotations & Arrows -->
  <g>
    <!-- Overshoot Annotation -->
    <text x="260" y="105" font-size="13" font-weight="bold" fill="#D55E00" class="text">Overshoot</text>
    <path d="M 255,102 L 208,102" fill="none" stroke="#D55E00" stroke-width="1.2" marker-end="url(#arrow-red)"/>

    <!-- Undershoot Annotation -->
    <text x="530" y="320" font-size="13" font-weight="bold" fill="#0072B2" class="text" text-anchor="middle">Undershoot</text>
    <path d="M 500,323 L 480,334" fill="none" stroke="#0072B2" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- Markers for Arrows -->
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/>
    </marker>
  </defs>

  <!-- Legend (Centered at Bottom) -->
  <g id="legend" transform="translate(70, 435)">
    <!-- Swatch 1: Admissible window -->
    <rect x="0" y="0" width="16" height="12" fill="#E4E7EB"/>
    <text class="text legend-text" x="22" y="10">Admissible window (0.3–0.7)</text>

    <!-- Swatch 2: Target -->
    <line x1="220" y1="6" x2="240" y2="6" stroke="#009E73" stroke-width="2.5"/>
    <text class="text legend-text" x="246" y="10">Target trajectory</text>

    <!-- Swatch 3: Burst -->
    <line x1="0" y1="22" x2="20" y2="22" stroke="#D55E00" stroke-width="2" stroke-dasharray="5,3"/>
    <text class="text legend-text" x="22" y="26">Burst (overshoot)</text>

    <!-- Swatch 4: Depleting -->
    <line x1="220" y1="22" x2="240" y2="22" stroke="#0072B2" stroke-width="2" stroke-dasharray="6,3,1,3"/>
    <text class="text legend-text" x="246" y="26">Depleting (undershoot)</text>
  </g>
</svg>
