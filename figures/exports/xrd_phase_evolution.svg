import numpy as np, glob, os
import matplotlib as mpl
import matplotlib.pyplot as plt

mpl.rcParams.update({
    "svg.fonttype": "none",                     # keep text as text, small file
    "font.family": ["Helvetica", "Arial", "DejaVu Sans", "sans-serif"],
    "font.size": 10, "axes.linewidth": 0.8,
})

# ---- phases: replace the angles with values generated from your CIF/ICDD cards
# (e.g. pymatgen XRDCalculator, wavelength 1.5406 Å); values below are approximate
PHASES = {
    "Wollastonite (PDF 27-1064)":        dict(c="#009E73", m="v", pk=[23.1, 25.3, 26.9, 29.9]),
    "Whitlockite / β-TCP (PDF 09-0169)": dict(c="#E69F00", m="s", pk=[27.8, 31.0, 34.4]),
    "HA / FAp (PDF 09-0432 / 15-0876)":  dict(c="#0072B2", m="o", pk=[25.9, 31.8, 32.2, 32.9, 34.0, 39.8, 46.7, 49.5]),
}
TEMP_COLORS = ["#4C78A8", "#59A14F", "#F2A93B", "#E4572E", "#8E5BA8"]

THEMES = {
    "light": dict(fg="#1f2328", bg="none", grid="#d0d7de"),
    "dark":  dict(fg="#e6edf3", bg="none", grid="#30363d"),
}

def load(path, step=0.02):
    x, y = np.loadtxt(path, unpack=True)
    y = (y - y.min()) / (y.max() - y.min())          # normalise 0-1
    return x, y

def make(theme, outfile, xlim=(20, 60), offset=1.15):
    t = THEMES[theme]
    files = sorted(glob.glob("data/*.xy"), key=lambda f: int(os.path.basename(f)[:-3]))
    fig, (ax, ref) = plt.subplots(
        2, 1, figsize=(8, 6.2), sharex=True,
        gridspec_kw=dict(height_ratios=[5, 1.3], hspace=0.04))
    fig.patch.set_alpha(0)

    for i, f in enumerate(files):
        T = os.path.basename(f)[:-3]
        x, y = load(f)
        ax.plot(x, y + i * offset, lw=0.9, color=TEMP_COLORS[i % 5])
        ax.text(xlim[1] - 0.3, i * offset + 0.12, f"{T} °C", ha="right",
                color=TEMP_COLORS[i % 5], fontsize=10, fontweight="bold")

    for k, (name, p) in enumerate(PHASES.items()):
        ref.vlines(p["pk"], k, k + 0.75, color=p["c"], lw=1.6)
        ref.text(xlim[0] + 0.3, k + 0.85, name, color=p["c"], fontsize=8.5, va="bottom")
        # light guide lines through the patterns for the strongest reflection
        ax.axvline(p["pk"][-1] if k == 0 else p["pk"][1], color=p["c"], lw=0.5, ls=":", alpha=.5)

    ax.set_ylabel("Normalised intensity (a.u., offset)")
    ax.set_yticks([]); ax.set_xlim(*xlim)
    ref.set_yticks([]); ref.set_ylim(0, 3.1)
    ref.set_xlabel(r"2$\theta$ (°), Cu K$\alpha$, $\lambda$ = 1.5406 Å")
    ax.set_title("Phase evolution of bioactive silicate ceramic with sintering temperature",
                 loc="left", fontsize=11.5, fontweight="bold", color=t["fg"])

    for a in (ax, ref):
        for s in ("top", "right"): a.spines[s].set_visible(False)
        a.tick_params(colors=t["fg"], direction="out")
        for s in a.spines.values(): s.set_color(t["fg"])
        a.xaxis.label.set_color(t["fg"]); a.yaxis.label.set_color(t["fg"])
    fig.savefig(outfile, transparent=True, bbox_inches="tight")

make("light", "xrd_light.svg")
make("dark",  "xrd_dark.svg")
