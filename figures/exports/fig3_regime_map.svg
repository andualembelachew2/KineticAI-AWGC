<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="630" viewBox="0 0 660 630" font-family="'Times New Roman', Times, 'Liberation Serif', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bandV" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bandH" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="660" height="630" fill="#ffffff"/>

  <!-- Plot area: x 90-570, y 40-520; centre (330,280); diagonal x+y = 610 -->
  <!-- regime fills -->
  <rect x="90"  y="280" width="240" height="240" fill="#dfeaf7"/>  <!-- Q1 -->
  <rect x="90"  y="40"  width="240" height="240" fill="#f3eaf9"/>  <!-- Q2 -->
  <rect x="330" y="280" width="240" height="240" fill="#eaf7ee"/>  <!-- Q3 -->
  <rect x="330" y="40"  width="240" height="240" fill="#fef5df"/>  <!-- Q4 -->

  <!-- crossover zones around Pe ~ 1 and Da ~ 1 -->
  <rect x="295" y="40"  width="70" height="480" fill="url(#bandV)"/>
  <rect x="90"  y="245" width="480" height="70" fill="url(#bandH)"/>

  <!-- Da = Pe line (tau_C = tau_R) -->
  <line x1="90" y1="520" x2="570" y2="40" stroke="#444" stroke-width="1" stroke-dasharray="1.5,3"/>

  <!-- regime boundaries -->
  <line x1="330" y1="40"  x2="330" y2="520" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="90"  y1="280" x2="570" y2="280" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- frame -->
  <rect x="90" y="40" width="480" height="480" fill="none" stroke="#000" stroke-width="1.2"/>

  <!-- ticks -->
  <g stroke="#000" stroke-width="1.2">
    <line x1="90"  y1="520" x2="90"  y2="526"/>
    <line x1="330" y1="520" x2="330" y2="526"/>
    <line x1="570" y1="520" x2="570" y2="526"/>
    <line x1="84" y1="520" x2="90" y2="520"/>
    <line x1="84" y1="280" x2="90" y2="280"/>
    <line x1="84" y1="40"  x2="90" y2="40"/>
  </g>
  <g font-size="14" fill="#000">
    <g text-anchor="middle">
      <text x="90"  y="544">≪ 1</text>
      <text x="330" y="544">∼ 1</text>
      <text x="570" y="544">≫ 1</text>
    </g>
    <g text-anchor="end">
      <text x="78" y="524.5">≪ 1</text>
      <text x="78" y="284.5">∼ 1</text>
      <text x="78" y="44.5">≫ 1</text>
    </g>
  </g>

  <!-- axis titles -->
  <text x="330" y="568" font-size="15" text-anchor="middle" fill="#000">log<tspan font-size="10.5" dy="4">10</tspan><tspan dy="-4"> (Pe)  —  convection / diffusion  →</tspan></text>
  <text transform="translate(26,280) rotate(-90)" font-size="15" text-anchor="middle" fill="#000">log<tspan font-size="10.5" dy="4">10</tspan><tspan dy="-4"> (Da)  —  reaction / diffusion  →</tspan></text>

  <!-- margin annotations -->
  <g font-size="11.5" font-style="italic" fill="#444">
    <text x="90"  y="30" text-anchor="start">← diffusion-dominated transport</text>
    <text x="570" y="30" text-anchor="end">convection-dominated transport →</text>
    <text transform="translate(590,40) rotate(90)"  text-anchor="start">fast reaction (Da ≫ 1)</text>
    <text transform="translate(590,520) rotate(90)" text-anchor="end">slow reaction (Da ≪ 1)</text>
  </g>

  <!-- Da = Pe label (rotated along the line) -->
  <g transform="translate(185,425) rotate(-45)">
    <text x="0" y="-5" font-size="11" text-anchor="middle" fill="#222">Da = Pe  (<tspan font-style="italic">τ</tspan><tspan font-size="8" dy="2.5">C</tspan><tspan dy="-2.5"> = </tspan><tspan font-style="italic">τ</tspan><tspan font-size="8" dy="2.5">R</tspan><tspan dy="-2.5">)</tspan></text>
  </g>

  <!-- ===== Quadrant annotations (top-left corner of each quadrant) ===== -->
  <g fill="#000">
    <!-- Q2 -->
    <text x="100" y="62" font-size="15" font-weight="bold">Q2</text>
    <text x="100" y="78" font-size="12.5" font-style="italic">diffusion-limited</text>
    <g font-size="10.5" fill="#333">
      <text x="100" y="94">Thiele <tspan font-style="italic">φ</tspan><tspan font-size="8" dy="-4">2</tspan><tspan dy="4"> = Da ≫ 1</tspan></text>
      <text x="100" y="107"><tspan font-style="italic">η</tspan> ∼ Da<tspan font-size="8" dy="-4">−1/2</tspan></text>
      <text x="100" y="120">steep internal gradient</text>
    </g>

    <!-- Q4 -->
    <text x="340" y="62" font-size="15" font-weight="bold">Q4</text>
    <text x="340" y="78" font-size="12.5" font-style="italic">convection-amplified</text>
    <g font-size="10.5" fill="#333">
      <text x="340" y="94">Sh ∼ Pe<tspan font-size="8" dy="-4">1/3</tspan></text>
      <text x="340" y="107">thin boundary layer</text>
    </g>

    <!-- Q1 -->
    <text x="100" y="302" font-size="15" font-weight="bold">Q1</text>
    <text x="100" y="318" font-size="12.5" font-style="italic">reaction-limited</text>
    <g font-size="10.5" fill="#333">
      <text x="100" y="334">kinetic control</text>
      <text x="100" y="347"><tspan font-style="italic">η</tspan> ≈ 1, uniform <tspan font-style="italic">c</tspan></text>
    </g>

    <!-- Q3 -->
    <text x="340" y="302" font-size="15" font-weight="bold">Q3</text>
    <text x="340" y="318" font-size="12.5" font-style="italic">convective washout</text>
    <g font-size="10.5" fill="#333">
      <text x="340" y="334"><tspan font-style="italic">τ</tspan><tspan font-size="8" dy="2.5">res</tspan><tspan dy="-2.5"> &lt; </tspan><tspan font-style="italic">τ</tspan><tspan font-size="8" dy="2.5">R</tspan></text>
      <text x="340" y="349">incomplete conversion</text>
    </g>
  </g>

  <!-- ===== Target locus ===== -->
  <rect x="295" y="245" width="70" height="70" fill="none" stroke="#a91d33" stroke-width="2" stroke-dasharray="7,3"/>
  <circle cx="330" cy="280" r="5" fill="#a91d33" stroke="#fff" stroke-width="1.2"/>
  <text x="374" y="259" font-size="13" font-weight="bold" fill="#a91d33">Design corridor</text>
  <text x="374" y="272" font-size="11" fill="#a91d33">target locus (Pe, Da ∼ 1)</text>

  <!-- ===== Representative regimes ===== -->
  <circle cx="150" cy="205" r="4.5" fill="#6b4fa8" stroke="#fff" stroke-width="1.2"/>
  <text x="160" y="209" font-size="12" fill="#6b4fa8">burst / passivation</text>

  <circle cx="180" cy="498" r="4.5" fill="#1f5aa8" stroke="#fff" stroke-width="1.2"/>
  <text x="190" y="502" font-size="12" fill="#1f5aa8">slow plateau</text>

  <circle cx="500" cy="455" r="4.5" fill="#1d7a6d" stroke="#fff" stroke-width="1.2"/>
  <text x="490" y="459" font-size="12" fill="#1d7a6d" text-anchor="end">washout regime</text>

  <!-- ===== Definitions ===== -->
  <g font-size="11.5" fill="#000" text-anchor="middle">
    <text x="330" y="592">Pe = <tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">D</tspan><tspan dy="-2.5">/</tspan><tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">C</tspan><tspan dy="-2.5"> = </tspan><tspan font-style="italic">UL</tspan>/<tspan font-style="italic">D</tspan>;   Da = <tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">D</tspan><tspan dy="-2.5">/</tspan><tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">R</tspan><tspan dy="-2.5">;   Da/Pe = </tspan><tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">C</tspan><tspan dy="-2.5">/</tspan><tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">R</tspan><tspan dy="-2.5"> (convective Damköhler number)</tspan></text>
    <text x="330" y="607" font-size="10.5" font-style="italic" fill="#333">τ<tspan font-size="8" dy="2.5">D</tspan><tspan dy="-2.5">, τ</tspan><tspan font-size="8" dy="2.5">C</tspan><tspan dy="-2.5">, τ</tspan><tspan font-size="8" dy="2.5">R</tspan><tspan dy="-2.5">: diffusion, convection and reaction time scales; </tspan><tspan>η: effectiveness factor; Sh: Sherwood number.</tspan></text>
    <text x="330" y="621" font-size="10.5" font-style="italic" fill="#333">Schematic: boundaries are order-of-magnitude (Pe, Da ≈ 1); shaded bands mark crossover zones.</text>
  </g>
</svg>
