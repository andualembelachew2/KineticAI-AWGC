<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"
     preserveAspectRatio="xMidYMid meet" style="background:#FFFFFF; color-scheme:light" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Pe-Da regime map</title>
  <desc id="desc">Regime map with log10 Pe on the horizontal axis and log10 Da on the vertical axis. Regimes are named R1 to R4 by increasing Pe and Da. Dashed lines mark Pe equals 1 and Da equals 1. A red dashed square is the design corridor (Da and Pe between about 0.3 and 3) and a red star at Pe equals Da equals 1 is the target locus.</desc>

  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #222; }
    .axis { stroke: #222; stroke-width: 1.2; }
    .frame { fill: none; stroke: #9aa5b1; stroke-width: 1; }
    .boundary { stroke: #777; stroke-width: 1.1; stroke-dasharray: 6 4; }
    .region-title { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .region-subtitle { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #222; }
    .region-note { font-size: 13px; font-style: italic; text-anchor: middle; fill: #444; }
    .tick { font-size: 13px; text-anchor: middle; }
    .axis-label { font-size: 16px; text-anchor: middle; }
    .red { fill: #a91d33; }
    .legend { font-size: 13px; }
  </style>

  <!-- pure white canvas: covers the whole figure so no dark page/theme colour shows through -->
  <rect id="canvas" x="0" y="0" width="760" height="520" fill="#FFFFFF"/>

  <!-- plot background: x=80..440, y=60..420; data x/y = [-2,2], 90 px per decade -->
  <rect id="r1-low-pe-low-da" x="80" y="240" width="180" height="180" fill="#e8f1fb"/>
  <rect id="r2-low-pe-high-da" x="80" y="60" width="180" height="180" fill="#f3ecf9"/>
  <rect id="r3-high-pe-low-da" x="260" y="240" width="180" height="180" fill="#e9f6ee"/>
  <rect id="r4-high-pe-high-da" x="260" y="60" width="180" height="180" fill="#fef3df"/>
  <rect id="plot-frame" class="frame" x="80" y="60" width="360" height="360"/>

  <!-- axes -->
  <line class="axis" x1="80" y1="420" x2="440" y2="420"/>
  <line class="axis" x1="80" y1="60" x2="80" y2="420"/>

  <!-- Pe = 1 and Da = 1 boundaries -->
  <line id="pe-equals-1" class="boundary" x1="260" y1="60" x2="260" y2="420"/>
  <line id="da-equals-1" class="boundary" x1="80" y1="240" x2="440" y2="240"/>

  <!-- tick marks + labels: data -2,-1,0,1,2 -->
  <g id="x-tick-marks">
    <line class="axis" x1="80" y1="420" x2="80" y2="425"/>
    <line class="axis" x1="170" y1="420" x2="170" y2="425"/>
    <line class="axis" x1="260" y1="420" x2="260" y2="425"/>
    <line class="axis" x1="350" y1="420" x2="350" y2="425"/>
    <line class="axis" x1="440" y1="420" x2="440" y2="425"/>
  </g>
  <g id="y-tick-marks">
    <line class="axis" x1="75" y1="420" x2="80" y2="420"/>
    <line class="axis" x1="75" y1="330" x2="80" y2="330"/>
    <line class="axis" x1="75" y1="240" x2="80" y2="240"/>
    <line class="axis" x1="75" y1="150" x2="80" y2="150"/>
    <line class="axis" x1="75" y1="60" x2="80" y2="60"/>
  </g>
  <g id="x-ticks">
    <text class="tick" x="80" y="445">−2</text>
    <text class="tick" x="170" y="445">−1</text>
    <text class="tick" x="260" y="445">0</text>
    <text class="tick" x="350" y="445">1</text>
    <text class="tick" x="440" y="445">2</text>
  </g>
  <g id="y-ticks">
    <text class="tick" x="66" y="425" text-anchor="end">−2</text>
    <text class="tick" x="66" y="335" text-anchor="end">−1</text>
    <text class="tick" x="66" y="245" text-anchor="end">0</text>
    <text class="tick" x="66" y="155" text-anchor="end">1</text>
    <text class="tick" x="66" y="65" text-anchor="end">2</text>
  </g>

  <text class="axis-label" x="260" y="485">log₁₀(Pe) — convection / diffusion</text>
  <text class="axis-label" x="26" y="240" transform="rotate(-90 26 240)">log₁₀(Da) — reaction / diffusion</text>

  <!-- region labels: moved to the outer edge of each quadrant, clear of the corridor -->
  <g id="region-labels">
    <!-- R1 -->
    <text class="region-title" x="170" y="356">R1</text>
    <text class="region-subtitle" x="170" y="376">reaction-limited</text>
    <text class="region-note" x="170" y="396">slow plateau</text>

    <!-- R2 -->
    <text class="region-title" x="170" y="96">R2</text>
    <text class="region-subtitle" x="170" y="116">diffusion-limited</text>
    <text class="region-note" x="170" y="136">burst / passivation</text>

    <!-- R3 -->
    <text class="region-title" x="350" y="356">R3</text>
    <text class="region-subtitle" x="350" y="376">convective washout</text>
    <text class="region-note" x="350" y="396">washout regime</text>

    <!-- R4 -->
    <text class="region-title" x="350" y="96">R4</text>
    <text class="region-subtitle" x="350" y="116">convection-amplified</text>
    <text class="region-note" x="350" y="136">amplified transport</text>
  </g>

  <!-- design corridor: +/-0.5 decade around Pe = Da = 1 (45 px); target star centred exactly on (260,240) -->
  <rect id="design-corridor" x="215" y="195" width="90" height="90" fill="none"
        stroke="#a91d33" stroke-width="2.5" stroke-dasharray="8 4"/>
  <path id="target-locus" class="red" stroke="white" stroke-width="1" transform="translate(0,-5)"
        d="M260 224 l6.2 12.6 13.9 2 -10 9.8 2.4 13.8 -12.5 -6.6 -12.5 6.6 2.4 -13.8 -10 -9.8 13.9 -2 z"/>
  <!-- direct label beside the box (no leader line crossing other text) -->
  <text class="red" x="313" y="190" font-size="14" font-weight="700" text-anchor="start">Design corridor</text>

 
  <g id="legend" transform="translate(470,80)">
    <rect x="0" y="0" width="270" height="228" fill="white" stroke="#bbb"/>


    <rect x="14" y="44" width="18" height="18" fill="#e8f1fb" stroke="#999"/>
    <text class="legend" x="42" y="58">R1 reaction-limited</text>

    <rect x="14" y="74" width="18" height="18" fill="#f3ecf9" stroke="#999"/>
    <text class="legend" x="42" y="88">R2 diffusion-limited</text>

    <rect x="14" y="104" width="18" height="18" fill="#e9f6ee" stroke="#999"/>
    <text class="legend" x="42" y="118">R3 convective washout</text>

    <rect x="14" y="134" width="18" height="18" fill="#fef3df" stroke="#999"/>
    <text class="legend" x="42" y="148">R4 convection-amplified</text>

    <rect x="14" y="164" width="18" height="14" fill="none" stroke="#a91d33" stroke-width="2" stroke-dasharray="6 3"/>
    <text class="legend" x="42" y="176">Design corridor (Da, Pe ≈ 0.3–3)</text>

    <path class="red" stroke="white" stroke-width="0.6" transform="translate(23,203) scale(0.5)"
          d="M0 -21.1 l6.2 12.6 13.9 2 -10 9.8 2.4 13.8 -12.5 -6.6 -12.5 6.6 2.4 -13.8 -10 -9.8 13.9 -2 z"/>
    <text class="legend" x="42" y="208">Target locus (Pe = Da = 1)</text>
  </g>
</svg>
