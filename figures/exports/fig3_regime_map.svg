"""
Damköhler–Péclet Regime Map (publication-ready)
------------------------------------------------
Reconstructed and enhanced from the original quadrant figure.
Axes: log10(Pe) = convection/diffusion (x), log10(Da) = reaction/diffusion (y)
Both axes run over three qualitative decades: << 1 | ~1 | >> 1

Edit the EDITABLE PARAMETERS block below to plug in your real Da/Pe values.
"""

import numpy as np
import matplotlib.pyplot as plt
import matplotlib.patches as mpatches
from matplotlib.patches import FancyArrowPatch, Rectangle
from matplotlib.lines import Line2D

# ----------------------------------------------------------------------
# EDITABLE PARAMETERS
# ----------------------------------------------------------------------
# Axis range in "decade units": -1 -> "<<1", 0 -> "~1", 1 -> ">>1"
AXIS_MIN, AXIS_MID, AXIS_MAX = -1.0, 0.0, 1.0

# Data points: (log10(Pe), log10(Da), label, color, label_offset(dx, dy))
points = [
    (-1.0,  1.0, "Slow plateau\n(reaction-controlled release)",  "#1f5aa8", (0.10, -0.18)),
    (-1.0, -1.0, "Burst / passivation\n(fast reaction, no transport)", "#6b4fa8", (0.10,  0.16)),
    ( 1.0,  1.0, "Washout regime\n(convection strips reactant)",   "#1d7a6d", (-1.55, 0.12)),
    ( 0.0,  0.0, "Target Locus\n(Design Corridor)",                "#a91d33", (0.10,  0.12)),
]

# Design corridor (dashed box) center + half-width, in decade units
corridor_center = (0.0, 0.0)
corridor_halfwidth = 0.30

quadrant_labels = {
    "Q1": ("REACTION-LIMITED", (-0.62, 0.50)),   # upper-left
    "Q2": ("DIFFUSION-LIMITED", (-0.62, -0.50)), # lower-left
    "Q3": ("CONVECTIVE WASHOUT", (0.40, 0.50)),  # upper-right
    "Q4": ("CONVECTION-AMPLIFIED", (0.40, -0.50)),  # lower-right
}

quadrant_colors = {
    "Q1": "#dfeaf7",  # upper-left, low Pe / high Da -> reaction-limited
    "Q2": "#f3eaf9",  # lower-left, low Pe / low Da  -> diffusion-limited
    "Q3": "#eaf7ee",  # upper-right, high Pe / high Da
    "Q4": "#fef5df",  # lower-right, high Pe / low Da
}

title = "Reaction–Diffusion–Convection Regime Map"
subtitle = "Positioning the target kinetic window relative to transport-controlled failure modes"

# ----------------------------------------------------------------------
# FIGURE SETUP  (publication style)
# ----------------------------------------------------------------------
plt.rcParams.update({
    "font.family": "DejaVu Sans",
    "font.size": 11,
    "axes.linewidth": 1.1,
    "xtick.major.width": 1.1,
    "ytick.major.width": 1.1,
    "mathtext.fontset": "dejavusans",
    "svg.fonttype": "path",  # Changed from "none" to "path" to fix SVG text rendering
})

fig, ax = plt.subplots(figsize=(7.2, 6.6), dpi=300)

lo, mid, hi = AXIS_MIN, AXIS_MID, AXIS_MAX
pad = 0.15
ax.set_xlim(lo - pad, hi + pad)
ax.set_ylim(lo - pad, hi + pad)

# --- Quadrant backgrounds ---
ax.add_patch(Rectangle((lo - pad, lo - pad), (mid - lo + pad), (mid - lo + pad),
                        facecolor=quadrant_colors["Q2"], alpha=0.55, zorder=0, lw=0))
ax.add_patch(Rectangle((lo - pad, mid), (mid - lo + pad), (hi - mid + pad),
                        facecolor=quadrant_colors["Q1"], alpha=0.55, zorder=0, lw=0))
ax.add_patch(Rectangle((mid, lo - pad), (hi - mid + pad), (mid - lo + pad),
                        facecolor=quadrant_colors["Q4"], alpha=0.55, zorder=0, lw=0))
ax.add_patch(Rectangle((mid, mid), (hi - mid + pad), (hi - mid + pad),
                        facecolor=quadrant_colors["Q3"], alpha=0.55, zorder=0, lw=0))

# --- Crosshair / decade gridlines ---
ax.axvline(mid, color="0.55", lw=0.9, ls=(0, (4, 2)), zorder=1)
ax.axhline(mid, color="0.55", lw=0.9, ls=(0, (4, 2)), zorder=1)

# --- Design corridor ---
cx, cy = corridor_center
hw = corridor_halfwidth
corridor = Rectangle((cx - hw, cy - hw), 2 * hw, 2 * hw,
                      facecolor="none", edgecolor="#a91d33", lw=2.0,
                      ls=(0, (6, 2.5)), zorder=4)
ax.add_patch(corridor)
ax.annotate("Target Locus\nDesign Corridor",
            xy=(cx + hw, cy + hw), xycoords="data",
            xytext=(12, 10), textcoords="offset points",
            color="#a91d33", fontsize=10.5, fontweight="bold",
            ha="left", va="bottom")

# --- Quadrant text labels ---
qtxt_style = dict(fontsize=10.5, fontweight="bold", ha="center", va="center",
                   color="#333333", zorder=3)
for key, (label, (x, y)) in quadrant_labels.items():
    tag = key[0] + key[1]
    ax.text(x, y + 0.09, tag, fontsize=13, fontweight="bold",
            ha="center", va="center", color="#333333", zorder=3)
    ax.text(x, y - 0.05, label, **qtxt_style)

# --- Data points ---
for px, py, label, color, (dx, dy) in points:
    if label.startswith("Target"):
        continue  # already annotated via corridor
    ax.scatter(px, py, s=95, color=color, edgecolor="white",
               linewidth=1.3, zorder=5)
    ax.annotate(label, xy=(px, py), xytext=(px + dx, py + dy),
                fontsize=9, color=color, fontweight="medium",
                ha="left" if dx >= 0 else "right", va="center",
                linespacing=1.3, zorder=6)

# central target point
ax.scatter(cx, cy, s=110, color="#a91d33", edgecolor="white",
           linewidth=1.4, zorder=6, marker="D")

# --- Axis ticks: <<1, ~1, >>1 ---
tick_positions = [lo, mid, hi]
tick_labels = [r"$\ll 1$", r"$\sim 1$", r"$\gg 1$"]
ax.set_xticks(tick_positions)
ax.set_xticklabels(tick_labels, fontsize=12)
ax.set_yticks(tick_positions)
ax.set_yticklabels(tick_labels, fontsize=12)
ax.tick_params(length=5)

ax.set_xlabel(r"$\log_{10}(\mathrm{Pe})$  —  convection / diffusion", fontsize=12, labelpad=10)
ax.set_ylabel(r"$\log_{10}(\mathrm{Da})$  —  reaction / diffusion", fontsize=12, labelpad=10)

ax.set_title(title, fontsize=14, fontweight="bold", pad=34)
ax.text(0.5, 1.035, subtitle, transform=ax.transAxes, ha="center", va="bottom",
        fontsize=9.5, style="italic", color="#555555")

# --- Clean spines ---
for spine in ["top", "right"]:
    ax.spines[spine].set_visible(False)
for spine in ["left", "bottom"]:
    ax.spines[spine].set_color("#333333")

ax.set_aspect("equal")

# --- Legend ---
legend_elems = [
    Line2D([0], [0], marker="D", color="none", markerfacecolor="#a91d33",
           markeredgecolor="white", markersize=9, label="Target design point"),
    Line2D([0], [0], color="#a91d33", lw=2, ls=(0, (6, 2.5)), label="Design corridor (tolerance band)"),
    Line2D([0], [0], marker="o", color="none", markerfacecolor="#1f5aa8",
           markeredgecolor="white", markersize=8, label="Slow plateau"),
    Line2D([0], [0], marker="o", color="none", markerfacecolor="#6b4fa8",
           markeredgecolor="white", markersize=8, label="Burst / passivation"),
    Line2D([0], [0], marker="o", color="none", markerfacecolor="#1d7a6d",
           markeredgecolor="white", markersize=8, label="Washout regime"),
]
ax.legend(handles=legend_elems, loc="upper center", bbox_to_anchor=(0.5, -0.16),
          ncol=2, frameon=False, fontsize=9)

fig.tight_layout()

# ----------------------------------------------------------------------
# EXPORT (vector + high-res raster)
# ----------------------------------------------------------------------
# Changed export paths to avoid FileNotFoundError on machines without /mnt/user-data/
fig.savefig("da_pe_regime_map.pdf", bbox_inches="tight")
fig.savefig("da_pe_regime_map.svg", bbox_inches="tight")
fig.savefig("da_pe_regime_map.png", bbox_inches="tight", dpi=600)
print("Saved PDF, SVG, and 600-dpi PNG to the current directory.")
plt.rcParams['svg.hashsalt'] = None # Resets metadata
