import matplotlib.pyplot as plt
from matplotlib.patches import Rectangle, Patch
from matplotlib.lines import Line2D

plt.rcParams.update({
    "font.family": "DejaVu Sans",
    "font.size": 10,
    "axes.linewidth": 0.9,
    "svg.fonttype": "none",      # use "path" only if the journal requires outlined text
})

XMIN, XMAX = -2, 2
YMIN, YMAX = -2, 2
B = 0  # boundary: Pe = 1, Da = 1

regions = [
    # x, y, w, h, color, title, implication
    (XMIN, YMIN, B-XMIN, B-YMIN, "#e8f1fb",
     "R1 — reaction-limited", "slow plateau"),
    (XMIN, B,    B-XMIN, YMAX-B, "#f3ecf9",
     "R2 — diffusion-limited", "burst / passivation"),
    (B,    YMIN, XMAX-B, B-YMIN, "#e9f6ee",
     "R3 — convective washout", "washout regime"),
    (B,    B,    XMAX-B, YMAX-B, "#fef3df",
     "R4 — convection-amplified", "amplified transport"),
]

fig, ax = plt.subplots(figsize=(7.2, 6.4), constrained_layout=True)

for x, y, w, h, color, title, note in regions:
    ax.add_patch(Rectangle((x, y), w, h, facecolor=color,
                           edgecolor="none", zorder=0))
    cx, cy = x + w/2, y + h/2
    ax.text(cx, cy + 0.18, title, ha="center", va="center",
            fontsize=12, fontweight="bold", zorder=2)
    ax.text(cx, cy - 0.22, note, ha="center", va="center",
            fontsize=9, style="italic", color="#333333", zorder=2)

# Boundaries Pe = 1 and Da = 1
ax.axvline(B, color="0.45", lw=1.0, ls=(0, (4, 2)), zorder=1)
ax.axhline(B, color="0.45", lw=1.0, ls=(0, (4, 2)), zorder=1)

# Design corridor and target locus: keep them visually distinct
corridor = Rectangle((-0.38, -0.34), 0.76, 0.68,
                     fill=False, edgecolor="#a91d33",
                     lw=2.0, ls=(0, (6, 3)), zorder=3)
ax.add_patch(corridor)
ax.scatter([0.05], [0.02], marker="*", s=190, color="#a91d33",
           edgecolor="white", linewidth=0.8, zorder=4, label="Target locus")

ax.annotate("Design corridor", xy=(0.38, 0.34), xytext=(0.72, 0.86),
            fontsize=9, color="#a91d33",
            arrowprops=dict(arrowstyle="-", color="#a91d33", lw=1.0))

ax.set_xlim(XMIN, XMAX)
ax.set_ylim(YMIN, YMAX)
ax.set_box_aspect(1)
ax.set_xticks(range(XMIN, XMAX + 1))
ax.set_yticks(range(YMIN, YMAX + 1))
ax.set_xlabel(r"$\log_{10}(\mathrm{Pe})$  [convection / diffusion]")
ax.set_ylabel(r"$\log_{10}(\mathrm{Da})$  [reaction / diffusion]")

handles = [
    Patch(facecolor="#e8f1fb", edgecolor="none", label="R1 reaction-limited"),
    Patch(facecolor="#f3ecf9", edgecolor="none", label="R2 diffusion-limited"),
    Patch(facecolor="#e9f6ee", edgecolor="none", label="R3 convective washout"),
    Patch(facecolor="#fef3df", edgecolor="none", label="R4 convection-amplified"),
    Line2D([0], [0], marker="*", color="none", markerfacecolor="#a91d33",
           markeredgecolor="white", markersize=11, label="Target locus"),
]
ax.legend(handles=handles, loc="center left", bbox_to_anchor=(1.02, 0.5),
          frameon=False, fontsize=9)

fig.savefig("pe_da_regime_map.svg", bbox_inches="tight",
            metadata={"Title": "Pe-Da regime map",
                      "Creator": "Matplotlib"})
