<?xml version="1.0" encoding="utf-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="513.200234pt" height="495.799062pt" viewBox="0 0 513.200234 495.799062" version="1.1">
  <metadata>
    <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
      <cc:Work>
        <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
        <dc:date>2026-10-05</dc:date>
        <dc:format>image/svg+xml</dc:format>
        <dc:creator>
          <cc:Agent>
            <dc:title>KineticAI-AWGC Regime Mapper</dc:title>
          </cc:Agent>
        </dc:creator>
      </cc:Work>
    </rdf:RDF>
  </metadata>

  <defs>
    <style type="text/css">
      .bg-q1 { fill: #dfeaf7; fill-opacity: 0.75; }
      .bg-q2 { fill: #f3eaf9; fill-opacity: 0.75; }
      .bg-q3 { fill: #eaf7ee; fill-opacity: 0.75; }
      .bg-q4 { fill: #fef5df; fill-opacity: 0.75; }
      .axis-frame { fill: none; stroke: #2c3e50; stroke-width: 2; }
      .grid-divide { stroke: #7f8c8d; stroke-width: 1.5; stroke-dasharray: 5,4; }
      .target-corridor { fill: #ffffff; fill-opacity: 0.9; stroke: #a91d33; stroke-width: 2; stroke-dasharray: 6,3; }
      .label-title { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; font-weight: bold; }
      .label-sub { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; font-size: 10px; }
      .label-desc { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; font-size: 9px; font-style: italic; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="513.200234" height="495.799062" fill="#ffffff"/>

  <g id="figure_1" transform="translate(10, 10)">
    
    <!-- Quadrant Background Regions -->
    <!-- Q2: Top-Left (Diffusion-Limited) -->
    <rect class="bg-q2" x="65" y="40" width="195" height="185" rx="4"/>
    <!-- Q4: Top-Right (Convection-Amplified) -->
    <rect class="bg-q4" x="260" y="40" width="195" height="185" rx="4"/>
    <!-- Q1: Bottom-Left (Reaction-Limited) -->
    <rect class="bg-q1" x="65" y="225" width="195" height="185" rx="4"/>
    <!-- Q3: Bottom-Right (Convective Washout) -->
    <rect class="bg-q3" x="260" y="225" width="195" height="185" rx="4"/>

    <!-- Kinetic Regime Divide Lines -->
    <line class="grid-divide" x1="260" y1="40" x2="260" y2="410"/>
    <line class="grid-divide" x1="65" y1="225" x2="455" y2="225"/>

    <!-- Central Target Locus / Design Corridor -->
    <rect class="target-corridor" x="212" y="177" width="96" height="96" rx="8" ry="8"/>
    <circle cx="260" cy="225" r="5" fill="#a91d33"/>
    <circle cx="260" cy="225" r="14" fill="none" stroke="#a91d33" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Bounding Frame -->
    <rect class="axis-frame" x="65" y="40" width="390" height="370"/>

    <!-- State Markers -->
    <circle cx="140" cy="110" r="6" fill="#4a235a"/>
    <circle cx="380" cy="110" r="6" fill="#7d6608"/>
    <circle cx="140" cy="340" r="6" fill="#1b4f72"/>
    <circle cx="380" cy="340" r="6" fill="#0e6655"/>

    <!-- Annotations & Labels -->
    <!-- Q2: Diffusion-Limited -->
    <g text-anchor="middle">
      <text x="140" y="132" class="label-title" font-size="12" fill="#4a235a">Diffusion-Limited</text>
      <text x="140" y="146" class="label-sub" fill="#7d3c98">Pe « 1, Da » 1</text>
      <text x="140" y="160" class="label-desc" fill="#5d6d7e">Passivation / burst boundary</text>
    </g>

    <!-- Q4: Convection-Amplified -->
    <g text-anchor="middle">
      <text x="380" y="132" class="label-title" font-size="12" fill="#7d6608">Convection-Amplified</text>
      <text x="380" y="146" class="label-sub" fill="#b7950b">Pe » 1, Da » 1</text>
      <text x="380" y="160" class="label-desc" fill="#5d6d7e">Fast conversion + advection</text>
    </g>

    <!-- Q1: Reaction-Limited -->
    <g text-anchor="middle">
      <text x="140" y="295" class="label-title" font-size="12" fill="#1b4f72">Reaction-Limited</text>
      <text x="140" y="309" class="label-sub" fill="#2e86c1">Pe « 1, Da « 1</text>
      <text x="140" y="323" class="label-desc" fill="#5d6d7e">Slow plateau state</text>
    </g>

    <!-- Q3: Convective Washout -->
    <g text-anchor="middle">
      <text x="380" y="295" class="label-title" font-size="12" fill="#0e6655">Convective Washout</text>
      <text x="380" y="309" class="label-sub" fill="#16a085">Pe » 1, Da « 1</text>
      <text x="380" y="323" class="label-desc" fill="#5d6d7e">Advective species depletion</text>
    </g>

    <!-- Design Corridor Label -->
    <g text-anchor="middle">
      <text x="260" y="198" class="label-title" font-size="11" fill="#a91d33">Design Corridor</text>
      <text x="260" y="211" class="label-desc" fill="#7b241c">(Pe ~ 1, Da ~ 1)</text>
      <text x="260" y="254" class="label-sub" font-size="9" fill="#a91d33" font-weight="bold">TARGET LOCUS</text>
    </g>

    <!-- Axis Ticks & Numerical Scale -->
    <!-- X-Axis -->
    <g font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle">
      <line x1="65" y1="410" x2="65" y2="415" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="65" y="428">-2</text>

      <line x1="162.5" y1="410" x2="162.5" y2="415" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="162.5" y="428">-1</text>

      <line x1="260" y1="410" x2="260" y2="415" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="260" y="428">0</text>

      <line x1="357.5" y1="410" x2="357.5" y2="415" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="357.5" y="428">1</text>

      <line x1="455" y1="410" x2="455" y2="415" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="455" y="428">2</text>
    </g>

    <!-- Y-Axis -->
    <g font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="end">
      <line x1="65" y1="410" x2="60" y2="410" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="54" y="413">-2</text>

      <line x1="65" y1="317.5" x2="60" y2="317.5" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="54" y="320.5">-1</text>

      <line x1="65" y1="225" x2="60" y2="225" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="54" y="228">0</text>

      <line x1="65" y1="132.5" x2="60" y2="132.5" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="54" y="135.5">1</text>

      <line x1="65" y1="40" x2="60" y2="40" stroke="#2c3e50" stroke-width="1.5"/>
      <text x="54" y="43">2</text>
    </g>

    <!-- Axis Titles -->
    <text x="260" y="458" class="label-title" font-size="13" fill="#2c3e50" text-anchor="middle">log₁₀(Pe)</text>
    <text x="18" y="225" class="label-title" font-size="13" fill="#2c3e50" text-anchor="middle" transform="rotate(-90 18 225)">log₁₀(Da)</text>

  </g>
</svg>
