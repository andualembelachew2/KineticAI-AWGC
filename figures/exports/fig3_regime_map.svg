<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" width="680" height="720" font-family="'Times New Roman', Times, 'Liberation Serif', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bandV" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bandH" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a91d33"/></marker>
  </defs>
  <rect width="680" height="720" fill="#fff"/>

  <!-- Title -->
  <text x="20" y="20" font-size="15" font-weight="bold" fill="#111">Transport–reaction regimes set how ions are released</text>

  <!-- Regime fills (plot area x 90–570, y 50–530; centre 330,290) -->
  <rect x="90"  y="290" width="240" height="240" fill="#dfeaf7"/>
  <rect x="90"  y="50"  width="240" height="240" fill="#f3eaf9"/>
  <rect x="330" y="290" width="240" height="240" fill="#eaf7ee"/>
  <rect x="330" y="50"  width="240" height="240" fill="#fef5df"/>

  <!-- crossover bands -->
  <rect x="295" y="50"  width="70" height="480" fill="url(#bandV)"/>
  <rect x="90"  y="255" width="480" height="70" fill="url(#bandH)"/>

  <!-- Da = Pe -->
  <line x1="90" y1="530" x2="570" y2="50" stroke="#444" stroke-width="1" stroke-dasharray="1.5,3"/>
  <!-- regime boundaries -->
  <line x1="330" y1="50" x2="330" y2="530" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="90" y1="290" x2="570" y2="290" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="5,3"/>
  <!-- frame -->
  <rect x="90" y="50" width="480" height="480" fill="none" stroke="#000" stroke-width="1.2"/>

  <!-- ticks -->
  <g stroke="#000" stroke-width="1.2">
    <line x1="90" y1="530" x2="90" y2="536"/><line x1="330" y1="530" x2="330" y2="536"/><line x1="570" y1="530" x2="570" y2="536"/>
    <line x1="84" y1="530" x2="90" y2="530"/><line x1="84" y1="290" x2="90" y2="290"/><line x1="84" y1="50" x2="90" y2="50"/>
  </g>
  <g font-size="14" fill="#000">
    <g text-anchor="middle"><text x="90" y="554">≪ 1</text><text x="330" y="554">∼ 1</text><text x="570" y="554">≫ 1</text></g>
    <g text-anchor="end"><text x="78" y="534.5">≪ 1</text><text x="78" y="294.5">∼ 1</text><text x="78" y="54.5">≫ 1</text></g>
  </g>

  <!-- axis titles -->
  <text x="330" y="574" font-size="14" text-anchor="middle" fill="#000">Péclet number, Pe  (convective vs diffusive transport)  →</text>
  <text transform="translate(26,290) rotate(-90)" font-size="14" text-anchor="middle" fill="#000">Damköhler number, Da  (reaction vs diffusion)  →</text>

  <!-- margin annotations -->
  <g font-size="11.5" font-style="italic" fill="#444">
    <text x="90"  y="42" text-anchor="start">← diffusion-dominated transport</text>
    <text x="570" y="42" text-anchor="end">convection-dominated transport →</text>
    <text transform="translate(590,50) rotate(90)" text-anchor="start">fast reaction (Da ≫ 1)</text>
    <text transform="translate(590,530) rotate(90)" text-anchor="end">slow reaction (Da ≪ 1)</text>
  </g>

  <!-- Da = Pe label -->
  <g transform="translate(185,435) rotate(-45)">
    <text x="0" y="-5" font-size="11" text-anchor="middle" fill="#222">Da = Pe  (<tspan font-style="italic">τ</tspan><tspan font-size="8" dy="2.5">C</tspan><tspan dy="-2.5"> = </tspan><tspan font-style="italic">τ</tspan><tspan font-size="8" dy="2.5">R</tspan><tspan dy="-2.5">)</tspan></text>
  </g>

  <!-- Quadrant annotations -->
  <g fill="#000">
    <text x="100" y="72" font-size="15" font-weight="bold">Q2</text>
    <text x="100" y="88" font-size="12.5" font-style="italic">diffusion-limited</text>
    <g font-size="10.5" fill="#333">
      <text x="100" y="104">reaction outpaces diffusion</text>
      <text x="100" y="117">Thiele <tspan font-style="italic">φ</tspan><tspan font-size="8" dy="-4">2</tspan><tspan dy="4"> = Da ≫ 1;  </tspan><tspan font-style="italic">η</tspan> ∼ Da<tspan font-size="8" dy="-4">−1/2</tspan></text>
      <text x="100" y="130">steep internal gradient</text>
    </g>

    <text x="340" y="72" font-size="15" font-weight="bold">Q4</text>
    <text x="340" y="88" font-size="12.5" font-style="italic">convection-amplified</text>
    <g font-size="10.5" fill="#333">
      <text x="340" y="104">flow thins the boundary layer</text>
      <text x="340" y="117">Sh ∼ Pe<tspan font-size="8" dy="-4">1/3</tspan></text>
    </g>

    <text x="100" y="312" font-size="15" font-weight="bold">Q1</text>
    <text x="100" y="328" font-size="12.5" font-style="italic">reaction-limited</text>
    <g font-size="10.5" fill="#333">
      <text x="100" y="344">kinetic control</text>
      <text x="100" y="357"><tspan font-style="italic">η</tspan> ≈ 1, uniform <tspan font-style="italic">c</tspan></text>
    </g>

    <text x="340" y="312" font-size="15" font-weight="bold">Q3</text>
    <text x="340" y="328" font-size="12.5" font-style="italic">convective washout</text>
    <g font-size="10.5" fill="#333">
      <text x="340" y="344"><tspan font-style="italic">τ</tspan><tspan font-size="8" dy="2.5">C</tspan><tspan dy="-2.5"> &lt; </tspan><tspan font-style="italic">τ</tspan><tspan font-size="8" dy="2.5">R</tspan><tspan dy="-2.5">: ions leave before reacting</tspan></text>
      <text x="340" y="357">incomplete conversion</text>
    </g>
  </g>

  <!-- Design corridor -->
  <rect x="295" y="255" width="70" height="70" fill="none" stroke="#a91d33" stroke-width="2" stroke-dasharray="7,3"/>
  <circle cx="330" cy="290" r="5" fill="#a91d33" stroke="#fff" stroke-width="1.2"/>
  <text x="374" y="266" font-size="13" font-weight="bold" fill="#a91d33">Design corridor</text>
  <text x="374" y="280" font-size="11" fill="#a91d33">target locus (Pe, Da ∼ 1):</text>
  <text x="374" y="293" font-size="11" fill="#a91d33">no single process dominates</text>

  <!-- Representative regimes -->
  <circle cx="150" cy="215" r="4.5" fill="#6b4fa8" stroke="#fff" stroke-width="1.2"/>
  <text x="160" y="219" font-size="12" fill="#6b4fa8">burst / passivation</text>
  <circle cx="180" cy="508" r="4.5" fill="#1f5aa8" stroke="#fff" stroke-width="1.2"/>
  <text x="190" y="512" font-size="12" fill="#1f5aa8">slow plateau</text>
  <circle cx="500" cy="465" r="4.5" fill="#1d7a6d" stroke="#fff" stroke-width="1.2"/>
  <text x="490" y="469" font-size="12" fill="#1d7a6d" text-anchor="end">washout regime</text>

  <!-- design arrows toward corridor -->
  <g stroke="#a91d33" stroke-width="1.3" stroke-dasharray="4,3" fill="none" opacity="0.8" marker-end="url(#aRed)">
    <path d="M156 220 L291 262" marker-end="url(#aRed)"/>
    <path d="M186 502 L294 328" marker-end="url(#aRed)"/>
    <path d="M496 458 L368 328" marker-end="url(#aRed)"/>
  </g>

  <!-- Caption -->
  <line x1="20" y1="592" x2="660" y2="592" stroke="#ccc"/>
  <g font-size="11.5" fill="#222">
    <text x="20" y="610"><tspan font-weight="bold">Figure.</tspan> Regime map for a degrading, ion-releasing scaffold. The Péclet number (Pe) compares convective and diffusive</text>
    <text x="20" y="625">transport; the Damköhler number (Da) compares reaction and diffusion. Together they split release behaviour into four</text>
    <text x="20" y="640">regimes: reaction-limited (Q1), diffusion-limited (Q2), convective washout (Q3) and convection-amplified (Q4). Release is</text>
    <text x="20" y="655">most controllable near Pe, Da ∼ 1 (red box), where no single process dominates. Dashed arrows show the design aim of</text>
    <text x="20" y="670">moving a system toward this corridor. The dotted diagonal, Da = Pe, marks equal convection and reaction time scales.</text>
  </g>
  <g font-size="10.5" fill="#444" font-style="italic">
    <text x="20" y="690" font-style="normal">Pe = <tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">D</tspan><tspan dy="-2.5">/</tspan><tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">C</tspan><tspan dy="-2.5"> = </tspan><tspan font-style="italic">UL</tspan>/<tspan font-style="italic">D</tspan>;  Da = <tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">D</tspan><tspan dy="-2.5">/</tspan><tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">R</tspan><tspan dy="-2.5">;  Da/Pe = </tspan><tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">C</tspan><tspan dy="-2.5">/</tspan><tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">R</tspan><tspan dy="-2.5"> (convective Damköhler number).  </tspan><tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">D</tspan><tspan dy="-2.5">, </tspan><tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">C</tspan><tspan dy="-2.5">, </tspan><tspan font-style="italic">τ</tspan><tspan font-size="8.5" dy="2.5">R</tspan><tspan dy="-2.5">: diffusion, convection, reaction time scales.</tspan></text>
    <text x="20" y="704">η: effectiveness factor; Sh: Sherwood number; <tspan>U, L, D: flow speed, length scale, diffusivity.</tspan> Schematic: boundaries are order-of-magnitude (Pe, Da ≈ 1);</text>
    <text x="20" y="716">shaded bands mark crossover zones; scalings are limiting-case estimates.</text>
  </g>
</svg>
