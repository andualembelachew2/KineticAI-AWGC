<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Pe-Da regime map</title>
  <desc id="desc">Regime map with log10 Pe on the horizontal axis and log10 Da on the vertical axis. Regimes are named R1 to R4 by increasing Pe and Da. Dashed lines mark Pe equals 1 and Da equals 1. A red dashed rectangle is the design corridor and a red star is the target locus.</desc>

  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #222; }
    .axis { stroke: #222; stroke-width: 1.2; }
    .boundary { stroke: #777; stroke-width: 1.1; stroke-dasharray: 6 4; }
    .region-title { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .region-note { font-size: 13px; font-style: italic; text-anchor: middle; fill: #444; }
    .tick { font-size: 13px; text-anchor: middle; }
    .axis-label { font-size: 16px; text-anchor: middle; }
    .red { fill: #a91d33; }
    .legend { font-size: 13px; }
  </style>

  <!-- plot background: x=80..440, y=60..420; data x/y = [-2,2] -->
  <rect id="r1-low-pe-low-da" x="80" y="240" width="180" height="180" fill="#e8f1fb"/>
  <rect id="r2-low-pe-high-da" x="80" y="60" width="180" height="180" fill="#f3ecf9"/>
  <rect id="r3-high-pe-low-da" x="260" y="240" width="180" height="180" fill="#e9f6ee"/>
  <rect id="r4-high-pe-high-da" x="260" y="60" width="180" height="180" fill="#fef3df"/>

  <!-- axes -->
  <line class="axis" x1="80" y1="420" x2="440" y2="420"/>
  <line class="axis" x1="80" y1="60" x2="80" y2="420"/>

  <!-- Pe = 1 and Da = 1 boundaries -->
  <line id="pe-equals-1" class="boundary" x1="260" y1="60" x2="260" y2="420"/>
  <line id="da-equals-1" class="boundary" x1="80" y1="240" x2="440" y2="240"/>

  <!-- ticks: data -2,-1,0,1,2 -->
  <g id="x-ticks">
    <text class="tick" x="80" y="445">−2</text>
    <text class="tick" x="170" y="445">−1</text>
    <text class="tick" x="260" y="445">0</text>
    <text class="tick" x="350" y="445">1</text>
    <text class="tick" x="440" y="445">2</text>
  </g>
  <g id="y-ticks">
    <text class="tick" x="60" y="425" text-anchor="end">−2</text>
    <text class="tick" x="60" y="335" text-anchor="end">−1</text>
    <text class="tick" x="60" y="245" text-anchor="end">0</text>
    <text class="tick" x="60" y="155" text-anchor="end">1</text>
    <text class="tick" x="60" y="65" text-anchor="end">2</text>
  </g>

  <text class="axis-label" x="260" y="485">log₁₀(Pe) — convection / diffusion</text>
  <text class="axis-label" x="28" y="240" transform="rotate(-90 28 240)">log₁₀(Da) — reaction / diffusion</text>

  <!-- region labels -->
  <g id="region-labels">
    <text class="region-title" x="170" y="322">R1 — reaction-limited</text>
    <text class="region-note" x="170" y="346">slow plateau</text>

    <text class="region-title" x="170" y="142">R2 — diffusion-limited</text>
    <text class="region-note" x="170" y="166">burst / passivation</text>

    <text class="region-title" x="350" y="322">R3 — convective washout</text>
    <text class="region-note" x="350" y="346">washout regime</text>

    <text class="region-title" x="350" y="142">R4 — convection-amplified</text>
    <text class="region-note" x="350" y="166">amplified transport</text>
  </g>

  <!-- design corridor and target -->
  <rect id="design-corridor" x="220" y="200" width="80" height="80" fill="none"
        stroke="#a91d33" stroke-width="2.5" stroke-dasharray="8 4"/>
  <path id="target-locus" class="red" stroke="white" stroke-width="1"
        d="M260 224 l6.2 12.6 13.9 2 -10 9.8 2.4 13.8 -12.5 -6.6 -12.5 6.6 2.4 -13.8 -10 -9.8 13.9 -2 z"/>
  <line x1="300" y1="208" x2="405" y2="120" stroke="#a91d33" stroke-width="1.2"/>
  <text class="red" x="410" y="116" font-size="14" font-weight="700">Design corridor</text>

  <!-- legend -->
  <g id="legend" transform="translate(470,80)">
    <rect x="0" y="0" width="250" height="190" fill="white" stroke="#bbb"/>
    <text x="14" y="26" font-weight="700" font-size="15">Legend</text>

    <rect x="14" y="44" width="18" height="18" fill="#e8f1fb" stroke="#999"/>
    <text class="legend" x="42" y="58">R1 reaction-limited</text>

    <rect x="14" y="74" width="18" height="18" fill="#f3ecf9" stroke="#999"/>
    <text class="legend" x="42" y="88">R2 diffusion-limited</text>

    <rect x="14" y="104" width="18" height="18" fill="#e9f6ee" stroke="#999"/>
    <text class="legend" x="42" y="118">R3 convective washout</text>

    <rect x="14" y="134" width="18" height="18" fill="#fef3df" stroke="#999"/>
    <text class="legend" x="42" y="148">R4 convection-amplified</text>

    <rect x="14" y="160" width="18" height="14" fill="none" stroke="#a91d33" stroke-width="2" stroke-dasharray="6 3"/>
    <text class="legend" x="42" y="172">target / corridor</text>
  </g>
</svg>
