<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b3b3b"/></marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d7a6d"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a91d33"/></marker>
  </defs>
  <rect width="1080" height="640" fill="#fff"/>

  <!-- Main title -->
  <text x="20" y="28" font-size="17" font-weight="700" fill="#222">Boundary recession couples chemistry to architecture: porosity and transport rise as the strut recedes</text>

  <!-- ============ Panel (a) ============ -->
  <g transform="translate(17,40)">
    <text x="3" y="20" font-size="12" font-weight="700" fill="#2b2b2b">(a) Moving-boundary strut cross-section</text>

    <!-- initial boundary -->
    <circle cx="169.46" cy="185.92" r="128.05" fill="none" stroke="#808080" stroke-width="1.5" stroke-dasharray="5.5 2.5"/>
    <!-- current surface + gel region -->
    <circle cx="169.46" cy="185.92" r="98.21" fill="#dfeaf7" stroke="#1d7a6d" stroke-width="2"/>
    <!-- unreacted core -->
    <circle cx="169.46" cy="185.92" r="58.39" fill="#efefef" stroke="#3b3b3b" stroke-width="2"/>
    <circle cx="169.46" cy="185.92" r="2" fill="#3b3b3b"/>

    <!-- core radius arrow -->
    <line x1="169.46" y1="185.92" x2="210" y2="151.5" stroke="#3b3b3b" stroke-width="2" stroke-linecap="round" marker-end="url(#aGrey)"/>
    <text x="203" y="183" font-size="12" font-style="italic" fill="#3b3b3b" stroke="#fff" stroke-width="3" paint-order="stroke">r<tspan font-size="9" dy="3">s</tspan><tspan dy="-3">(t)</tspan></text>
    <text x="131" y="207" font-size="10.5" fill="#3b3b3b">unreacted core</text>

    <!-- gel thickness arrow -->
    <line x1="233.9" y1="185.92" x2="261.6" y2="185.92" stroke="#1d7a6d" stroke-width="2" marker-start="url(#aTeal)" marker-end="url(#aTeal)"/>
    <text x="236" y="204" font-size="12" font-style="italic" fill="#1d7a6d">δ<tspan font-size="9" dy="3">g</tspan><tspan dy="-3">(t)</tspan></text>

    <!-- receding arrow -->
    <line x1="292.4" y1="185.92" x2="275.6" y2="185.92" stroke="#a91d33" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aRed)"/>
    <text x="300" y="181" font-size="10.5" font-weight="700" fill="#a91d33">receding</text>
    <text x="300" y="194" font-size="10.5" font-weight="700" fill="#a91d33">surface</text>

    <!-- labels -->
    <text x="119" y="47" font-size="10.5" fill="#666">initial boundary (<tspan font-style="italic">t</tspan> = 0)</text>
    <text x="291" y="100" font-size="10.5" fill="#666">pore solution</text>
    <text x="3" y="82" font-size="10.5" fill="#1d7a6d" font-weight="700">gel layer</text>
    <text x="3" y="94" font-size="10" fill="#1d7a6d">(silica-rich, diffusion barrier)</text>
    <path d="M38 98 Q70 122 101.7 146.8" fill="none" stroke="#1d7a6d" stroke-width="1.2" stroke-linecap="round"/>

    <!-- key -->
    <g font-size="10" fill="#555">
      <line x1="3" y1="338" x2="25" y2="338" stroke="#808080" stroke-width="1.5" stroke-dasharray="5.5 2.5"/>
      <text x="30" y="341">position at <tspan font-style="italic">t</tspan> = 0</text>
      <line x1="125" y1="338" x2="147" y2="338" stroke="#1d7a6d" stroke-width="2"/>
      <text x="152" y="341">current surface at <tspan font-style="italic">t</tspan></text>
    </g>
  </g>

  <!-- ============ Panel (b) ============ -->
  <g transform="translate(215,40)">
    <text x="407.6" y="11.4" font-size="12" font-weight="700" fill="#2b2b2b">(b) Pore-structure and transport evolution</text>

    <rect x="407.6" y="17.4" width="438.2" height="337.1" fill="#fff"/>
    <rect x="793.3" y="17.4" width="52.6" height="337.1" fill="#f2f2f2"/>
    <line x1="793.3" y1="17.4" x2="793.3" y2="354.5" stroke="#808080" stroke-width="1.2" stroke-dasharray="4.4 1.9"/>
    <text x="802" y="276.7" font-size="10" fill="#666">collapse</text>
    <text x="802" y="289" font-size="10" fill="#666">risk</text>

    <!-- axes -->
    <line x1="407.6" y1="354.5" x2="407.6" y2="17.4" stroke="#444" stroke-width="1"/>
    <line x1="407.6" y1="354.5" x2="845.8" y2="354.5" stroke="#444" stroke-width="1"/>
    <g stroke="#444" stroke-width="0.8">
      <line x1="407.6" y1="354.5" x2="407.6" y2="358"/><line x1="495.3" y1="354.5" x2="495.3" y2="358"/>
      <line x1="582.9" y1="354.5" x2="582.9" y2="358"/><line x1="670.6" y1="354.5" x2="670.6" y2="358"/>
      <line x1="758.2" y1="354.5" x2="758.2" y2="358"/><line x1="845.8" y1="354.5" x2="845.8" y2="358"/>
      <line x1="404" y1="354.5" x2="407.6" y2="354.5"/><line x1="404" y1="289.6" x2="407.6" y2="289.6"/>
      <line x1="404" y1="224.8" x2="407.6" y2="224.8"/><line x1="404" y1="160" x2="407.6" y2="160"/>
      <line x1="404" y1="95.2" x2="407.6" y2="95.2"/><line x1="404" y1="30.3" x2="407.6" y2="30.3"/>
    </g>
    <g font-size="10" fill="#444" text-anchor="middle">
      <text x="407.6" y="369">0.0</text><text x="495.3" y="369">0.2</text><text x="582.9" y="369">0.4</text>
      <text x="670.6" y="369">0.6</text><text x="758.2" y="369">0.8</text><text x="845.8" y="369">1.0</text>
    </g>
    <g font-size="10" fill="#444" text-anchor="end">
      <text x="400.6" y="358.3">0.0</text><text x="400.6" y="293.4">0.5</text><text x="400.6" y="228.6">1.0</text>
      <text x="400.6" y="163.8">1.5</text><text x="400.6" y="99">2.0</text><text x="400.6" y="34.1">2.5</text>
    </g>
    <text x="626.7" y="385" font-size="12" text-anchor="middle" fill="#2b2b2b">Normalised time, <tspan font-style="italic">t</tspan></text>
    <text transform="translate(372,186) rotate(-90)" font-size="12" text-anchor="middle" fill="#2b2b2b">Normalised value (a.u.)</text>

    <!-- curves -->
    <path d="M407.6 331.1 L418.6 331 L430.7 330.7 L443.9 330 L458.2 329.1 L472.4 328 L486.7 326.7 L502.1 325 L517.5 323.1 L532.8 320.9 L548.2 318.6 L563.6 316 L580.1 313 L596.5 309.8 L613 306.3 L629.5 302.6 L646 298.6 L662.4 294.5 L678.9 290.1 L695.4 285.5 L713 280.4 L730.5 275 L748.1 269.4 L765.7 263.5 L783.2 257.5 L800.8 251.1 L818.4 244.6 L836 237.8 L845.8 233.9" fill="none" stroke="#6b4fa8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M407.6 338.9 L413.1 338.8 L421.9 338.2 L431.8 337.4 L442.8 336.3 L454.9 334.8 L468 332.9 L482.3 330.7 L496.6 328.2 L512 325.4 L527.4 322.3 L543.8 318.7 L560.3 314.9 L577.9 310.7 L595.4 306.2 L614.1 301.2 L632.8 295.9 L651.5 290.5 L671.2 284.5 L691 278.2 L711.9 271.4 L732.7 264.4 L753.6 257.1 L775.6 249.1 L797.5 241 L819.5 232.6 L842.6 223.5 L845.8 222.2" fill="none" stroke="#a91d33" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M407.6 95.2 L410.9 95.6 L417.5 96.7 L426.3 98.5 L437.3 101 L450.5 104.3 L464.8 108.1 L481.2 112.7 L498.8 117.8 L518.6 123.8 L539.4 130.4 L561.4 137.6 L585.6 145.7 L610.8 154.4 L637.2 163.8 L664.6 173.8 L694.3 184.8 L725 196.4 L756.9 208.7 L789.8 221.7 L823.9 235.3 L845.8 244.3" fill="none" stroke="#1d7a6d" stroke-width="2" stroke-dasharray="7.4 3.2"/>

    <!-- legend -->
    <g font-size="11" fill="#2b2b2b">
      <line x1="560" y1="40" x2="590" y2="40" stroke="#6b4fa8" stroke-width="2.5" stroke-linecap="round"/>
      <text x="598" y="44"><tspan font-style="italic">ε</tspan>(<tspan font-style="italic">t</tspan>): porosity</text>
      <line x1="560" y1="58" x2="590" y2="58" stroke="#a91d33" stroke-width="2.2" stroke-linecap="round"/>
      <text x="598" y="62"><tspan font-style="italic">D</tspan><tspan font-size="8" dy="3">eff</tspan><tspan dy="-3">(</tspan><tspan font-style="italic">t</tspan>): effective diffusivity</text>
      <line x1="560" y1="76" x2="590" y2="76" stroke="#1d7a6d" stroke-width="2" stroke-dasharray="7.4 3.2"/>
      <text x="598" y="80"><tspan font-style="italic">κ̄</tspan>(<tspan font-style="italic">t</tspan>): mean pore-wall curvature</text>
    </g>
  </g>

  <!-- Caption -->
  <line x1="20" y1="478" x2="1060" y2="478" stroke="#ccc"/>
  <g font-size="12" fill="#333">
    <text x="20" y="500"><tspan font-weight="700">Figure.</tspan> Moving-boundary description of a degrading scaffold strut. <tspan font-weight="700">(a)</tspan> Cross-section of a strut in pore solution. The outer surface recedes inward from its</text>
    <text x="20" y="518">initial position (dashed) as the material dissolves. A gel layer of thickness <tspan font-style="italic">δ</tspan><tspan font-size="9" dy="3">g</tspan><tspan dy="-3">(</tspan><tspan font-style="italic">t</tspan>) forms around an unreacted core of radius <tspan font-style="italic">r</tspan><tspan font-size="9" dy="3">s</tspan><tspan dy="-3">(</tspan><tspan font-style="italic">t</tspan>).</text>
    <text x="20" y="536"><tspan font-weight="700">(b)</tspan> As the boundary recedes, porosity <tspan font-style="italic">ε</tspan> and effective diffusivity <tspan font-style="italic">D</tspan><tspan font-size="9" dy="3">eff</tspan><tspan dy="-3"> rise while mean pore-wall curvature</tspan> <tspan font-style="italic">κ̄</tspan> falls. In the shaded late stage the strut</text>
    <text x="20" y="554">approaches structural collapse, so transport and mechanics can no longer be treated independently.</text>
    <text x="20" y="578" font-size="10.5" fill="#555"><tspan font-weight="700">Notes:</tspan> schematic, model-type trends in normalised units, not measured data. Time is scaled to the end of the simulated window (<tspan font-style="italic">t</tspan> = 1).</text>
  </g>
</svg>
